<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบสมาชิก Discord</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* โทนสี Vibrant Pastel Gradient */
            --bg-gradient: linear-gradient(135deg, #a8edd9 0%, #fed6e3 50%, #d4fc79 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --primary-color: #5865F2;
            --primary-hover: #4752C4;
            --accent-pink: #ff758c;
            --accent-green: #2ec4b6;
            --text-dark: #2b2d42;
            --text-muted: #6c757d;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Design */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 460px;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .icon-box {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            color: var(--primary-color);
        }

        h2 {
            color: var(--text-dark);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ปุ่มและสถานะ */
        .btn {
            width: 100%;
            padding: 15px 24px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .btn-discord {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-discord:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.3);
        }

        .btn-copy {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #ffffff;
        }

        .btn-copy:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
        }

        /* Textarea Zone */
        .textarea-container {
            position: relative;
            margin-bottom: 20px;
        }

        .text-box {
            width: 100%;
            height: 130px;
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-dark);
            font-size: 15px;
            resize: none;
            outline: none;
            user-select: all;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .badge-locked {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 117, 140, 0.15);
            color: var(--accent-pink);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .badge-verified {
            background: rgba(46, 196, 182, 0.15);
            color: var(--accent-green);
        }

        .hidden { display: none; }

        /* Toast แจ้งเตือน */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-dark);
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Step 1: ล็อคการเข้าถึง - บังคับเข้ากลุ่ม Discord -->
    <div id="step-auth" class="card">
        <div class="icon-header">
            <div class="icon-box"><i class="fa-brands fa-discord"></i></div>
        </div>
        
        <div class="badge-locked">
            <i class="fa-solid fa-lock"></i> จำเป็นต้องเป็นสมาชิก Discord
        </div>

        <h2>เข้ากลุ่มเพื่อปลดล็อคข้อความ</h2>
        <p>คุณต้องยืนยันตัวตนด้วย Discord และเป็นสมาชิกในเซิร์ฟเวอร์ของเราก่อน จึงจะสามารถดูข้อความลับได้</p>
        
        <button onclick="loginWithDiscord()" class="btn btn-discord">
            <i class="fa-brands fa-discord"></i> ยืนยันตัวตนด้วย Discord
        </button>
    </div>

    <!-- Step 2: แสดงเมื่อผ่านการตรวจสอบว่าอยู่ในกลุ่มแล้วจริงๆ -->
    <div id="step-content" class="card hidden">
        <div class="icon-header">
            <div class="icon-box" style="color: var(--accent-green);">
                <i class="fa-solid fa-circle-check"></i>
            </div>
        </div>

        <div class="badge-locked badge-verified">
            <i class="fa-solid fa-shield-halved"></i> ตรวจสอบสมาชิกสำเร็จ
        </div>

        <h2>คัดลอกข้อความของคุณ</h2>
        <p>ข้อความพร้อมสำหรับการใช้งานแล้ว กดปุ่มด้านล่างเพื่อคัดลอกได้ทันที</p>
        
        <div class="textarea-container">
            <!-- ใส่ข้อความลับที่คุณต้องการแจกไว้ตรงนี้ได้เลยครับ -->
            <textarea id="copy-text" class="text-box" readonly>ข้อความลับสุดพิเศษ หรือลิงก์ดาวน์โหลดสำหรับสมาชิกกลุ่ม Discord เท่านั้น!</textarea>
        </div>
        
        <button onclick="copyToClipboard()" class="btn btn-copy">
            <i class="fa-regular fa-copy"></i> คัดลอกข้อความ
        </button>
    </div>

    <!-- Toast แจ้งเตือนคัดลอก -->
    <div id="toast" class="toast">คัดลอกข้อความลง Clipboard แล้ว!</div>

    <script>
        // ================= CONFIGURATION (ใส่ข้อมูลของคุณเรียบร้อยแล้ว) =================
        const CLIENT_ID = "1530840274757091369"; 
        const GUILD_ID = "1514118942921068595"; 
        const DISCORD_INVITE_LINK = "https://discord.gg/gWjRk6mQAA";
        const DISCORD_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1530838611216564328/HHlWFGg44kEZzstzWfXkux-TQSsOX_Y-qP1WyOJf-x-V1qvwiDM1gJtNA2y3rvc2iJdE";
        
        const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0]; // URL ของหน้าเว็บปัจจุบัน
        // =================================================================================

        // ฟังก์ชันเริ่มกระบวนการยืนยันตัวตนผ่าน Discord
        function loginWithDiscord() {
            const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds`;
            window.location.href = oauthUrl;
        }

        // เช็คการส่งค่ากลับจาก Discord (OAuth2 Callback)
        window.onload = async function() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                // มี Token ส่งกลับมา -> แสดงสถานะกำลังเช็ค
                document.getElementById('step-auth').innerHTML = "<h3>กำลังตรวจสอบการเป็นสมาชิก...</h3>";
                
                const isInGuild = await checkGuildMembership(accessToken, GUILD_ID);

                if (isInGuild) {
                    // หากอยู่ในกลุ่มแล้วจริง -> แสดงหน้าข้อความ
                    document.getElementById('step-auth').classList.add('hidden');
                    document.getElementById('step-content').classList.remove('hidden');
                    
                    // ส่ง Webhook แจ้งเตือนเข้า Discord Server
                    sendDiscordWebhook(accessToken);
                } else {
                    // หากยังไม่ได้เข้ากลุ่ม -> เด้งไปหน้า Invite เข้ากลุ่ม
                    alert("คุณยังไม่ได้เข้าร่วมกลุ่ม Discord ของเรา! กรุณากดเข้าร่วมกลุ่มก่อนครับ");
                    window.location.href = DISCORD_INVITE_LINK;
                }
            }
        };

        // ฟังก์ชันดึงข้อมูลจาก Discord API ตรวจสอบว่าผู้ใช้อยู่ในกลุ่มหรือไม่
        async function checkGuildMembership(token, guildId) {
            try {
                const response = await fetch('https://discord.com/api/users/@me/guilds', {
                    headers: { authorization: `Bearer ${token}` }
                });
                const guilds = await response.json();
                return guilds.some(guild => guild.id === guildId);
            } catch (err) {
                console.error("API Error:", err);
                return false;
            }
        }

        // ฟังก์ชันส่ง Webhook
        function sendDiscordWebhook(token) {
            fetch('https://discord.com/api/users/@me', {
                headers: { authorization: `Bearer ${token}` }
            }).then(res => res.json()).then(user => {
                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: "ระบบตรวจสอบสมาชิก",
                        avatar_url: "https://i.imgur.com/4M34hi2.png",
                        embeds: [{
                            title: "🎉 ยืนยันตัวตนสำเร็จ!",
                            description: `ผู้ใช้งาน **${user.username}** ผ่านการตรวจสอบสมาชิก และเข้าดูข้อความเรียบร้อยแล้ว`,
                            color: 3066993, // สีเขียวมิ้นต์
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
            }).catch(err => console.error("Webhook Error:", err));
        }

        // ฟังก์ชันคัดลอกข้อความ
        function copyToClipboard() {
            const copyText = document.getElementById("copy-text");
            navigator.clipboard.writeText(copyText.value).then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 3000);
            });
        }
    </script>
</body>
</html>
